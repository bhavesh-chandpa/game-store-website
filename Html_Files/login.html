<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Games Store </title>
    <link rel="stylesheet" type="text/css" href="../Css_Files/main.css">
    <link rel="stylesheet" type="text/css" href="../Css_Files/login.css">
    <script src="../JavaScript_Files/login.js"></script>
    <link rel="stylesheet" type="text/css" href="../Css_Files/store.css">
</head>
<body>
    <div class="leftmenu">
        <a href="home.html" class="logodiv">
            <img src="../Images/game.png" id="logo" alt="Games Store logo">
            <h2 class="webname"> Games Store </h2>
        </a>
        <a href="home.html" class="menudivs homeb">
            <p class="menutext hc"> Home </p>
        </a>
        <a href="offers.html" class="menudivs offersb">
            <p class="menutext"> Offers </p>
        </a>
        <a href="about.html" class="menudivs aboutb">
            <p class="menutext"> About Us </p>
        </a>
        <a href="contact.html" class="menudivs contactb">
            <p class="menutext"> Contact Us </p>
        </a>
    </div>
    <div class="topdiv">
        <div class="srchdiv">
            <input type="search" placeholder="Search Store" class="srch">
        </div>
        <div class="logsigdiv">
            <a href="login.html" class="lsbtn lb">
                <p class="lstext lt"> Login </p>
            </a>
            <a href="signup.html" class="lsbtn">
                <p class="lstext"> Sign Up </p>
            </a>
        </div>
    </div>
    <div class="maindiv">
        <div class="logincontainer">
            <h1 class="logtxt"> Sign In </h1>

            <label for="email" class="text"> Email Address </label>
            <input id="email" type="text" name="email" class="box">
            <span id="email-error" class="error"></span>

            <label for="password" class="text ppad"> Password </label>
            <input id="password" type="password" name="password" class="box">
            <span id="password-error" class="error"></span>

            <a href="forgotpass.html" class="frgtpass"> Forgot password? </a>
            <input type="button" value="Sign In" class="subtn" onClick="return validate()">
            <p class="actext"> Don't have an account? </p>
            <a href="signup.html" class="signuplink"> Create account </a>
        </div>
    </div>
    <script src="../JavaScript_Files/store.js"></script>
</body>
</html>
